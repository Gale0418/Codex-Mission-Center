name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: python (${{ matrix.os }}, ${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [core, websocket]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install optional WebSocket transport
        if: matrix.runtime == 'websocket'
        run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Verify optional WebSocket transport
        if: matrix.runtime == 'websocket'
        run: python -c "import websockets; assert websockets.__version__.split('.')[0] == '16'"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Exercise one local Mission Center workspace
        shell: bash
        run: |
          workspace="${RUNNER_TEMP}/mc-demo"
          python skills/mission-center/scripts/bootstrap_mission_center.py "$workspace" --language zh-TW
          python skills/mission-center/scripts/normalize_mission_center.py "$workspace"
          python skills/mission-center/scripts/sync_mission_center.py "$workspace"
          python skills/mission-center/scripts/doctor_mission_center.py "$workspace"

  test:
    name: test
    needs: [python, rust, rust-release, rust-stable-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Python, Rust, and release jobs to succeed
        run: |
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.rust-release.result }}" = "success"
          test "${{ needs.rust-stable-package.result }}" = "success"

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="$HOME/.cargo/bin/rustup"
          if [ "$RUNNER_OS" = "Windows" ]; then
            rustup_bin="${rustup_bin}.exe"
          fi
          test -f "$rustup_bin"
          "$rustup_bin" toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          echo "RUSTUP_BIN=$rustup_bin" >> "$GITHUB_ENV"
      - name: Audit vendored Cargo.lock sources
        if: hashFiles('rust/vendor/**') != '' && hashFiles('rust/.cargo/config.toml') != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          workspace = Path("rust").resolve()
          config_path = workspace / ".cargo" / "config.toml"
          config = tomllib.loads(config_path.read_text(encoding="utf-8"))
          source = config.get("source", {})
          if source.get("crates-io", {}).get("replace-with") != "vendored-sources":
              raise SystemExit("Cargo config must replace crates-io with vendored-sources")
          if source.get("vendored-sources", {}).get("directory") != "vendor":
              raise SystemExit("Cargo config must use the vendor directory")

          allowed_registries = {
              "registry+https://github.com/rust-lang/crates.io-index",
              "registry+https://index.crates.io/",
              "sparse+https://index.crates.io/",
          }
          lock = tomllib.loads((workspace / "Cargo.lock").read_text(encoding="utf-8"))
          vendor = workspace / "vendor"

          def workspace_path(value):
              uri = urlsplit(value[5:])
              path = unquote(uri.path) if uri.scheme == "file" else value[5:]
              if os.name == "nt" and path.startswith("/") and len(path) > 2 and path[2] == ":":
                  path = path[1:]
              candidate = Path(path).resolve()
              try:
                  candidate.relative_to(workspace)
              except ValueError as exc:
                  raise SystemExit(f"Cargo.lock path source escapes workspace: {value}") from exc
              if not candidate.exists():
                  raise SystemExit(f"Cargo.lock path source does not exist: {value}")
              return candidate

          for package in lock.get("package", []):
              package_source = package.get("source")
              if package_source is None:
                  continue
              if package_source.startswith("git+"):
                  raise SystemExit(f"Cargo.lock contains a git dependency: {package_source}")
              if package_source.startswith("path+"):
                  workspace_path(package_source)
                  continue
              if package_source not in allowed_registries:
                  raise SystemExit(f"Cargo.lock contains an unknown source/registry: {package_source}")
              checksum = package.get("checksum", "")
              if not re.fullmatch(r"[0-9a-f]{64}", checksum):
                  raise SystemExit(f"Missing or invalid checksum for {package['name']}")
              package_dir = vendor / f"{package['name']}-{package['version']}"
              metadata = next((package_dir / name for name in (".crate-checksum.json", ".cargo-checksum.json") if (package_dir / name).is_file()), None)
              if metadata is None:
                  raise SystemExit(f"Missing vendor checksum metadata for {package['name']}")
              payload = json.loads(metadata.read_text(encoding="utf-8"))
              vendor_checksum = payload.get("package", payload.get("checksum", ""))
              if vendor_checksum != checksum:
                  raise SystemExit(f"Vendor checksum mismatch for {package['name']}")
          PY
      - name: Validate Cargo metadata offline
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUSTUP_BIN"
          "$RUSTUP_BIN" run 1.98.0 cargo metadata --locked --offline --format-version 1 > /dev/null
      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          "$RUSTUP_BIN" run 1.98.0 cargo fmt --all -- --check
      - name: Run Rust Clippy
        shell: bash
        run: |
          set -euo pipefail
          "$RUSTUP_BIN" run 1.98.0 cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Run Rust tests offline
        shell: bash
        run: |
          set -euo pipefail
          "$RUSTUP_BIN" run 1.98.0 cargo test --workspace --locked --offline
      - name: Build Rust CLI for differential tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUSTUP_BIN" run 1.98.0 cargo build --package mission-center-cli --locked --offline
      - name: Configure Rust differential binary
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'rust/target/debug/mission-center'
          if ($IsWindows) {
            $binary += '.exe'
          }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Rust differential binary was not built: $binary"
          }
          "MISSION_CENTER_RUST_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Rust/Python differential tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: python -m unittest tests.test_rust_differential -v

  rust-release:
    name: rust release (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mission-center.exe
            smoke: true
          - variant: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mission-center
            smoke: true
          - variant: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: mission-center
            smoke: true
          - variant: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: mission-center
            # The build is valid on a cross-target runner; smoke is only
            # reported when uname proves that this is an arm64 host.
            smoke: conditional
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    env:
      RELEASE_VERSION: "0.5.1"
      RELEASE_VARIANT: ${{ matrix.variant }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require clean source checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --cached --quiet
          git diff --quiet
      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup_bin="$HOME/.cargo/bin/rustup"
          if [ "$RUNNER_OS" = "Windows" ]; then rustup_bin="${rustup_bin}.exe"; fi
          test -f "$rustup_bin"
          "$rustup_bin" toolchain install 1.98.0 --profile minimal
          echo "RUSTUP_BIN=$rustup_bin" >> "$GITHUB_ENV"
      - name: Check target availability without pretending to cross-build
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if "$RUSTUP_BIN" target list --toolchain 1.98.0 --installed | grep -Fx "$RELEASE_TARGET"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_VARIANT" = "macos-aarch64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "macos-aarch64 cross-build unavailable: target $RELEASE_TARGET is not installed; smoke=unknown" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "target $RELEASE_TARGET is unavailable on $RUNNER_OS" >&2
            exit 1
          fi
      - name: Validate release metadata offline
        if: steps.target.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RUSTUP_BIN" run 1.98.0 cargo metadata --locked --offline --format-version 1 > /dev/null
      - name: Build release CLI without fallback
        if: steps.target.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RUSTUP_BIN" run 1.98.0 cargo build --release --package mission-center-cli --target "$RELEASE_TARGET" --locked --offline
      - name: Check release binary architecture magic
        if: steps.target.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$RELEASE_TARGET/release/$RELEASE_BINARY"
          test -s "$binary"
          magic="$(od -An -tx1 -N4 "$binary" | tr -d ' \n')"
          case "$RELEASE_VARIANT" in
            windows-x86_64)
              test "$magic" = "4d5a"
              test "$(od -An -tx2 -j68 -N2 "$binary" | tr -d ' \n')" = "8664"
              ;;
            linux-x86_64)
              test "$magic" = "7f454c46"
              test "$(od -An -tx1 -j4 -N1 "$binary" | tr -d ' \n')" = "02"
              test "$(od -An -tx2 -j18 -N2 "$binary" | tr -d ' \n')" = "003e"
              ;;
            macos-x86_64)
              test "$magic" = "cffaedfe"
              test "$(od -An -tx4 -j4 -N4 "$binary" | tr -d ' \n')" = "01000007"
              ;;
            macos-aarch64)
              test "$magic" = "cffaedfe"
              test "$(od -An -tx4 -j4 -N4 "$binary" | tr -d ' \n')" = "0100000c"
              ;;
            *) exit 2 ;;
          esac
      - name: Run read-only CLI release smoke
        if: steps.target.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$RELEASE_TARGET/release/$RELEASE_BINARY"
          before="$(git status --porcelain)"
          smoke="pass"
          if [ "$RELEASE_VARIANT" = "macos-aarch64" ] && [ "$(uname -m)" != "arm64" ]; then
            smoke="unknown"
            echo "macos-aarch64 smoke=unknown: runner is $(uname -m), not arm64" >> "$GITHUB_STEP_SUMMARY"
          else
            runtime_output="$RUNNER_TEMP/mission-center-runtime-capability.json"
            publish_output="$RUNNER_TEMP/mission-center-publish-verify.json"
            runtime_rc=0
            "$binary" runtime capability > "$runtime_output" || runtime_rc=$?
            test "$runtime_rc" -eq 0
            jq -e '. | type == "object" and .schemaVersion == "1.0" and .command == "runtime" and .route == "runtime" and .status == "ok" and .data.mode == "capability" and .data.persistent == false' "$runtime_output" > /dev/null
            publish_rc=0
            cat ci/fixtures/publish-verify.json | "$binary" publish verify --platform "$RELEASE_VARIANT" --version "$RELEASE_VERSION" --input - > "$publish_output" || publish_rc=$?
            test "$publish_rc" -eq 0
            jq -e --arg version "$RELEASE_VERSION" --arg platform "$RELEASE_VARIANT" '. | type == "object" and .schemaVersion == "1.0" and .command == "publish verify" and .route == "publish verify" and .status == "pass" and .data.verified == true and .data.manifest.version == $version and .data.artifact.platform == $platform' "$publish_output" > /dev/null
            echo "fixture smoke: publish verify passed for $RELEASE_VARIANT" >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$before" = "$(git status --porcelain)"
          echo "$smoke" > "$RUNNER_TEMP/mission-center-smoke"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
      - name: Write per-platform SHA-256 manifest
        if: steps.target.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | awk '{print $1}'
            else
              echo "no SHA-256 utility available" >&2
              return 1
            fi
          }
          binary="target/$RELEASE_TARGET/release/$RELEASE_BINARY"
          checksum="$(hash_file "$binary")"
          smoke="$(cat "$RUNNER_TEMP/mission-center-smoke")"
          mkdir -p "release/$RELEASE_VARIANT"
          cp "$binary" "release/$RELEASE_VARIANT/$RELEASE_BINARY"
          cat > "release/$RELEASE_VARIANT/checksum-manifest.json" <<EOF
          {"schemaVersion":"1.0","kind":"mission-center-cli-release","version":"$RELEASE_VERSION","platform":"$RELEASE_VARIANT","target":"$RELEASE_TARGET","runner":"${{ matrix.runner }}","binary":"$RELEASE_BINARY","sha256":"$checksum","smoke":"$smoke"}
          EOF
          manifest="release/$RELEASE_VARIANT/checksum-manifest.json"
          test "$(hash_file "release/$RELEASE_VARIANT/$RELEASE_BINARY")" = "$checksum"
           jq -e --arg variant "$RELEASE_VARIANT" --arg target "$RELEASE_TARGET" --arg binary "$RELEASE_BINARY" --arg sha "$checksum" --arg smoke "$smoke" '. | type == "object" and .schemaVersion == "1.0" and .platform == $variant and .target == $target and .binary == $binary and .sha256 == $sha and .smoke == $smoke' "$manifest" > /dev/null
      - name: Record unavailable target as explicit unknown
        if: always() && steps.target.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release/$RELEASE_VARIANT"
          cat > "release/$RELEASE_VARIANT/availability.json" <<EOF
          {"schemaVersion":"1.0","kind":"mission-center-release-status","version":"$RELEASE_VERSION","platform":"$RELEASE_VARIANT","target":"$RELEASE_TARGET","status":"unknown","reason":"target unavailable on $RUNNER_OS"}
          EOF
          jq -e --arg variant "$RELEASE_VARIANT" --arg target "$RELEASE_TARGET" --arg version "$RELEASE_VERSION" '.schemaVersion == "1.0" and .kind == "mission-center-release-status" and .version == $version and .platform == $variant and .target == $target and .status == "unknown"' "release/$RELEASE_VARIANT/availability.json" > /dev/null
      - name: Retain release binary and checksum manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission-center-${{ matrix.variant }}
          path: rust/release/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14

  rust-stable-package:
    name: rust stable package gate
    needs: [rust-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: "0.5.1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require clean source checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --cached --quiet
          git diff --quiet
      - name: Require explicit historical replay evidence
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          record="MissionCenter/evidence/historical-validation-2026-08-29.json"
          test -s "$record"
          jq -e '
            .artifactType == "historical-validation" and
            (.tasks | type == "array" and length == 60) and
            (all(.tasks[];
              (.historicalReplay.status == "pass" and
               (.historicalReplay.revision | type == "string") and
               (.historicalReplay.revision | test("^[0-9a-f]{40}$")) and
               .historicalReplay.classification != "Unknown" and
               .historicalReplay.sourceClassification != "Unknown")
            ))
          ' "$record" > /dev/null || {
            echo "stable package blocked: every historical replay must be an explicit pass with a task-level 40-hex revision" >&2
            exit 1
          }
          while IFS= read -r revision; do
            git cat-file -e "$revision^{commit}"
          done < <(jq -r '.tasks[].historicalReplay.revision' "$record")
      - name: Collect release matrix artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mission-center-*
          path: ${{ runner.temp }}/mission-center-release-input
          merge-multiple: false
      - name: Assemble and verify frozen stable package
        shell: bash
        run: |
          set -euo pipefail

          input="$RUNNER_TEMP/mission-center-release-input"
          package_root="$RUNNER_TEMP/mission-center-frozen-package"
          package_json="$RUNNER_TEMP/mission-center-frozen-package.json"
          files_json="$RUNNER_TEMP/mission-center-frozen-files.json"
          if [ ! -d "$input" ]; then
            echo "stable package blocked: release artifact input directory is missing" >&2
            exit 1
          fi
          expected_artifacts="$(printf '%s\n' \
            mission-center-linux-x86_64 \
            mission-center-macos-aarch64 \
            mission-center-macos-x86_64 \
            mission-center-windows-x86_64 | sort)"
          actual_artifacts="$(find "$input" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$actual_artifacts" != "$expected_artifacts" ]; then
            echo "stable package blocked: release artifact set is not exactly the four expected platforms" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected_artifacts" "$actual_artifacts" >&2
            exit 1
          fi
          validate_artifact_layout() {
            local variant="$1"
            local binary="$2"
            local artifact_dir="$input/mission-center-$variant"
            local expected actual
            if [ -f "$artifact_dir/checksum-manifest.json" ]; then
              expected="$(printf '%s\n' "$binary" checksum-manifest.json | sort)"
            elif [ -f "$artifact_dir/availability.json" ]; then
              expected="availability.json"
            else
              echo "stable package blocked: $variant has neither a checksum nor explicit availability manifest" >&2
              return 1
            fi
            actual="$(find "$artifact_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "stable package blocked: unexpected files in $variant artifact" >&2
              printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
              return 1
            fi
          }
          validate_artifact_layout windows-x86_64 mission-center.exe
          validate_artifact_layout linux-x86_64 mission-center
          validate_artifact_layout macos-x86_64 mission-center
          validate_artifact_layout macos-aarch64 mission-center
          rm -rf "$package_root"
          mkdir -p "$package_root/bin"

          fail=0
          platforms='[]'
          add_platform() {
            local variant="$1"
            local target="$2"
            local binary="$3"
            local os="$4"
            local arch="$5"
            local package_binary="$6"
            local artifact_dir="$input/mission-center-$variant"
            local binary_path="$artifact_dir/$binary"
            local checksum_manifest="$artifact_dir/checksum-manifest.json"
            if [ ! -s "$binary_path" ] || [ ! -f "$checksum_manifest" ]; then
              if [ -f "$artifact_dir/availability.json" ]; then
                if jq -e --arg variant "$variant" '.status == "unknown" and .platform == $variant' "$artifact_dir/availability.json" > /dev/null; then
                  echo "stable package blocked: $variant is unknown (target unavailable)" >&2
                else
                  echo "stable package blocked: invalid unavailable status for $variant" >&2
                fi
              else
                echo "stable package blocked: missing artifact for $variant" >&2
              fi
              fail=1
              return
            fi
            local checksum
            checksum="$(sha256sum "$binary_path" | awk '{print $1}')"
            jq -e --arg variant "$variant" --arg target "$target" --arg binary "$binary" --arg version "$RELEASE_VERSION" --arg checksum "$checksum" '.schemaVersion == "1.0" and .kind == "mission-center-cli-release" and .version == $version and .platform == $variant and .target == $target and .binary == $binary and .sha256 == $checksum' "$checksum_manifest" > /dev/null || {
              echo "stable package blocked: checksum manifest mismatch for $variant" >&2
              fail=1
              return
            }
            mkdir -p "$(dirname "$package_root/$package_binary")"
            cp "$binary_path" "$package_root/$package_binary"
            platforms="$(jq -c --arg platform "$variant" --arg path "$package_binary" --arg sha256 "$checksum" --arg version "$RELEASE_VERSION" --arg os "$os" --arg arch "$arch" '. + [{platform:$platform,path:$path,sha256:$sha256,version:$version,os:$os,arch:$arch,executable:$path}]' <<< "$platforms")"
          }

          add_platform windows-x86_64 x86_64-pc-windows-msvc mission-center.exe windows x86_64 bin/windows-x86_64/mission-center.exe
          add_platform linux-x86_64 x86_64-unknown-linux-gnu mission-center linux x86_64 bin/linux-x86_64/mission-center
          add_platform macos-x86_64 x86_64-apple-darwin mission-center macos x86_64 bin/macos-x86_64/mission-center
          add_platform macos-aarch64 aarch64-apple-darwin mission-center macos aarch64 bin/macos-aarch64/mission-center
          test "$fail" -eq 0

          jq -n --arg schemaVersion "1.0" --arg pluginName "mission-center" --arg version "$RELEASE_VERSION" --argjson artifacts "$platforms" '{schemaVersion:$schemaVersion,pluginName:$pluginName,version:$version,artifacts:$artifacts}' > "$package_root/platform-manifest.json"
          jq -e --arg version "$RELEASE_VERSION" '.schemaVersion == "1.0" and .pluginName == "mission-center" and .version == $version and (.artifacts | length == 4) and ([.artifacts[].platform] | sort == ["linux-x86_64","macos-aarch64","macos-x86_64","windows-x86_64"])' "$package_root/platform-manifest.json" > /dev/null

          if ! jq -e --arg version "$RELEASE_VERSION" 'type == "object" and .name == "mission-center" and .version == $version' .codex-plugin/plugin.json > /dev/null; then
            echo "stable package blocked: root plugin manifest must be version $RELEASE_VERSION" >&2
            exit 1
          fi
          if ! jq -e 'type == "object" and .kind == "mission-center-python-oracle-boundary" and .runtime == "python" and .formalPluginIncluded == false and (.sourceRoots | type == "array" and length > 0) and (.exclusions | index("formal-plugin-runtime") != null) and (.exclusions | index("stable-package") != null)' compat/python-oracle/manifest.json > /dev/null; then
            echo "stable package blocked: Python oracle boundary manifest is missing or permits formal runtime" >&2
            exit 1
          fi
          if grep -R -n -E 'python([0-9]+)?[[:space:]]|prompt_router\\.py|hud_autolaunch\\.py|publish_local\\.py' hooks .codex-plugin 2>/dev/null; then
            echo "stable package blocked: formal plugin inputs still invoke Python runtime" >&2
            exit 1
          fi
          echo '[]' > "$files_json"
          add_file() {
            local source="$1"
            local target="$2"
            local executable="$3"
            local encoded="$RUNNER_TEMP/mission-center-file.b64"
            local item="$RUNNER_TEMP/mission-center-file.json"
            local next="$RUNNER_TEMP/mission-center-files.next.json"
            test -f "$source"
            base64 -w0 "$source" > "$encoded"
            jq -n --arg path "$target" --rawfile content "$encoded" --argjson executable "$executable" '{path:$path,contentBase64:$content,executable:$executable}' > "$item"
            jq --slurpfile item "$item" '. + $item' "$files_json" > "$next"
            mv "$next" "$files_json"
          }

          for item in .codex-plugin assets hooks skills scripts; do
            if [ "$item" = "scripts" ]; then
              # Source-checkout publisher/install helpers stay compatibility
              # tooling; they are never part of the Rust formal package.
              continue
            fi
            if [ -d "$item" ]; then
              while IFS= read -r -d '' source; do
                relative="${source#./}"
                case "$relative" in
                  */__pycache__/*|*.py|*.pyc|*.pyo) continue ;;
                  .codex-plugin/release-preview.json) continue ;;
                esac
                add_file "$source" "$relative" false
              done < <(find "$item" -type f -print0 | sort -z)
            fi
          done
          for item in README.md LICENSE NOTICE.md PRIVACY.md; do
            if [ -f "$item" ]; then
              add_file "$item" "$item" false
            fi
          done
          add_file "$package_root/platform-manifest.json" platform-manifest.json false
          add_file bin/mission-center bin/mission-center true
          add_file bin/mission-center.ps1 bin/mission-center.ps1 false
          add_file "$package_root/bin/windows-x86_64/mission-center.exe" bin/windows-x86_64/mission-center.exe true
          add_file "$package_root/bin/linux-x86_64/mission-center" bin/linux-x86_64/mission-center true
          add_file "$package_root/bin/macos-x86_64/mission-center" bin/macos-x86_64/mission-center true
          add_file "$package_root/bin/macos-aarch64/mission-center" bin/macos-aarch64/mission-center true
          jq -n --arg format "frozen-package-v1" --arg schemaVersion "1.0" --slurpfile files "$files_json" '{format:$format,schemaVersion:$schemaVersion,files:$files[0]}' > "$package_json"
          jq -e 'all(.files[]; ((.path | endswith(".py")) | not) and ((.path | endswith(".pyc")) | not) and ((.path | startswith("scripts/")) | not) and ((.path | startswith("compat/")) | not) and .path != "requirements-runtime.txt" and .path != ".codex-plugin/release-preview.json")' "$package_json" > /dev/null
          jq -e 'any(.files[]; .path == "bin/mission-center.ps1" and .executable == false)' "$package_json" > /dev/null

          verifier="$input/mission-center-linux-x86_64/mission-center"
          test -s "$verifier"
          chmod +x "$verifier"
          verify_output="$RUNNER_TEMP/mission-center-stable-verify.json"
          "$verifier" publish verify --platform linux-x86_64 --version "$RELEASE_VERSION" --input - < "$package_json" > "$verify_output"
          jq -e --arg version "$RELEASE_VERSION" '.status == "pass" and .data.verified == true and .data.manifest.version == $version and (.data.manifest.artifacts | length == 4) and ([.data.manifest.artifacts[].platform] | sort == ["linux-x86_64","macos-aarch64","macos-x86_64","windows-x86_64"])' "$verify_output" > /dev/null
          echo "Rust publish verify accepted the actual four-platform frozen package." >> "$GITHUB_STEP_SUMMARY"
          registration_root="$RUNNER_TEMP/mission-center-native-registration-smoke"
          rm -rf "$registration_root"
          mkdir -p "$registration_root/plugins/mission-center"
          cp -a "$package_root"/. "$registration_root/plugins/mission-center/"
          registration_output="$RUNNER_TEMP/mission-center-native-registration.json"
          "$verifier" install register apply --plugin-root "$registration_root/plugins/mission-center" --marketplace-root "$registration_root" --operation-id stable-registration-smoke --version "$RELEASE_VERSION" > "$registration_output"
          jq -e --arg version "$RELEASE_VERSION" '.status == "ok" and .command == "install" and .data.registered == true and .data.mutationSupported == true and .data.receipt.status == "committed" and .data.receipt.operationId == "stable-registration-smoke" and .data.receipt.version == $version' "$registration_output" > /dev/null
          registration_receipt="$(jq -r '.data.receipt.transactionRoot + "/" + .data.receipt.operationId + ".json"' "$registration_output")"
          "$verifier" install register reconcile --marketplace-root "$registration_root" > "$RUNNER_TEMP/mission-center-native-registration-reconcile.json"
          "$verifier" install register rollback --receipt "$registration_receipt" > "$RUNNER_TEMP/mission-center-native-registration-rollback.json"
          jq -e '.status == "ok" and .data.rolledBack == true and .data.receipt.status == "rolledback"' "$RUNNER_TEMP/mission-center-native-registration-rollback.json" > /dev/null
          test ! -e "$registration_root/.agents/plugins/marketplace.json"
          echo "Rust native marketplace registration accepted, reconciled, and rolled back the local manifest." >> "$GITHUB_STEP_SUMMARY"
          install_root="$RUNNER_TEMP/mission-center-native-install-smoke"
          rm -rf "$install_root"
          install_output="$RUNNER_TEMP/mission-center-native-install.json"
          "$verifier" install apply --package "$package_root" --destination "$install_root" --operation-id stable-install-smoke --platform linux-x86_64 --version "$RELEASE_VERSION" > "$install_output"
          jq -e --arg version "$RELEASE_VERSION" '.status == "ok" and .command == "install" and .data.installed == true and .data.mutationSupported == true and .data.receipt.status == "committed" and .data.receipt.operationId == "stable-install-smoke"' "$install_output" > /dev/null
          test -f "$install_root/platform-manifest.json"
          echo "Rust native install transaction accepted and materialized the verified package." >> "$GITHUB_STEP_SUMMARY"
          publish_root="$RUNNER_TEMP/mission-center-native-publish-smoke"
          rm -rf "$publish_root"
          publish_output="$RUNNER_TEMP/mission-center-native-publish.json"
          "$verifier" publish apply --package "$package_root" --destination "$publish_root" --operation-id stable-publish-smoke --platform linux-x86_64 --version "$RELEASE_VERSION" > "$publish_output"
          jq -e --arg version "$RELEASE_VERSION" '.status == "ok" and .command == "publish" and .data.published == true and .data.mutationSupported == true and .data.receipt.status == "committed" and .data.receipt.operationId == "stable-publish-smoke"' "$publish_output" > /dev/null
          test -f "$publish_root/platform-manifest.json"
          echo "Rust native publish transaction accepted and materialized the verified package." >> "$GITHUB_STEP_SUMMARY"
          reconcile_output="$RUNNER_TEMP/mission-center-native-reconcile.json"
          "$verifier" install reconcile --root "$RUNNER_TEMP" > "$reconcile_output"
          jq -e '.status == "ok" and .command == "install" and .data.reconciled == true and .data.mutationSupported == true and ([.data.receipts[] | select(.status == "committed")] | length >= 2)' "$reconcile_output" > /dev/null
          echo "Rust native reconcile reported committed install/publish receipts without unsafe replay." >> "$GITHUB_STEP_SUMMARY"
