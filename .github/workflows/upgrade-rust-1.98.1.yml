name: One-shot Rust 1.98.1 upgrade

on:
  push:
    branches: [chore/rust-1.98.1]
    paths:
      - ".github/workflows/upgrade-rust-1.98.1.yml"

jobs:
  stage-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Generate exact Rust 1.98.1 CI candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ci.yml')
          text = source.read_text(encoding='utf-8')
          count = text.count('1.98.0')
          if count != 10:
              raise SystemExit(f'Expected exactly 10 CI references to Rust 1.98.0, got {count}')
          candidate = text.replace('1.98.0', '1.98.1')
          if '1.98.0' in candidate:
              raise SystemExit('Rust 1.98.0 remains in generated CI candidate')
          Path('ci-rust-1.98.1.yml').write_text(candidate, encoding='utf-8')
          print('Generated ci-rust-1.98.1.yml with 10 exact replacements')
          PY
          git diff --check -- ci-rust-1.98.1.yml
          grep -n -F '1.98.1' ci-rust-1.98.1.yml
      - name: Commit staged CI blob to upgrade branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-rust-1.98.1.yml
          git commit -m 'chore: stage Rust 1.98.1 CI candidate'
          git push origin HEAD:chore/rust-1.98.1
